<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bekendmakingen NL – Laatste bekendmakingen</title>
  <script src="/homey.js" data-origin="settings"></script>
  <style>
    :root {color-scheme: light dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif}
    body {margin:0; padding:18px 16px 28px; background: transparent; color: var(--homey-text-color, inherit); font-size:14px}
    .wrap {max-width:730px; margin:auto}
    h1 {font-size:21px; line-height:1.3; margin:0 0 6px}
    .muted {opacity:.72; font-size:13px; line-height:1.45}
    .control {margin-top:22px}
    .control label {display:block; font-weight:650; margin:0 0 8px}
    select, input[type=number] {width:100%;max-width:100%; box-sizing:border-box; padding:12px 14px; font:inherit; border-radius:10px; background:var(--homey-background-color,transparent); color:inherit; border:1px solid #8996a4}
    .count-row {display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .count-row input {width:95px}
    .count-row button {min-height:44px}
    .hint {font-size:12px; line-height:1.4; opacity:.72; margin-top:7px}
    .meta {font-size:13px; opacity:.75; line-height:1.45; margin:12px 0 18px}
    .list {display:grid; gap:12px; padding:0; margin:0; list-style:none}
    .notice {border:1px solid rgba(127,127,127,.35); border-radius:14px; padding:16px; background:rgba(127,127,127,.055); min-width:0}
    .top {display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
    .category {font-size:12px; font-weight:700; padding:4px 9px; border-radius:999px; color:#fff; background:#154273}
    .date {font-size:12px; opacity:.7; text-align:right}
    .title {font-size:16px; line-height:1.4; font-weight:650; margin:12px 0; overflow-wrap:anywhere; white-space:normal}
    .detail {font-size:13px; line-height:1.45; opacity:.86; margin:5px 0; overflow-wrap:anywhere; white-space:normal}
    .link {display:inline-flex; min-height:40px; align-items:center; margin-top:12px; font-weight:700; color:#0878dc; text-decoration:underline; cursor:pointer; overflow-wrap:anywhere}
    .link:focus-visible {outline:2px solid #0878dc; outline-offset:4px}
    .controls {display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:0 0 14px}
    button {font:inherit; border-radius:10px; padding:9px 13px; border:1px solid #999; background:transparent; color:inherit; cursor:pointer}
    .status {font-size:13px; opacity:.75}
    .quality {font-size:11px; opacity:.8; border:1px solid currentColor; border-radius:5px; padding:2px 5px}
    .message {border:1px dashed #aaa; border-radius:12px; padding:16px; font-size:14px; line-height:1.5}
    @media (max-width:360px) {.top{flex-wrap:wrap}.date{text-align:left}}
  </style>
</head>
<body>
 <main class="wrap">
  <h1 id="heading">Laatste bekendmakingen</h1>
  <div class="muted" id="subtitle">Alle categorieën, met volledige tekst en officiële links. Bij onzekere locaties staat dit erbij.</div>
  <div class="control">
   <label id="address-label" for="monitor">Bewaakt adres</label>
   <select id="monitor" aria-label="Bewaakt adres" disabled><option>Laden…</option></select>
  </div>
  <div class="control">
   <label id="count-label" for="count">Aantal zichtbare bekendmakingen</label>
   <div class="count-row">
    <input id="count" type="number" min="1" max="50" step="1" inputmode="numeric" value="5" aria-describedby="count-hint">
    <button id="save-count" type="button">Opslaan</button>
   </div>
   <div id="count-hint" class="hint">Kies 1 tot 50 per bewaakt adres. Standaard 5. Extra oudere berichten worden zichtbaar na de eerstvolgende geslaagde controle.</div>
  </div>
  <p class="meta" id="meta"></p>
  <div class="controls"><button id="refresh" type="button">Overzicht verversen</button><span id="status" class="status" role="status" aria-live="polite"></span></div>
  <ol id="notices" class="list" aria-label="Bekendmakingen"></ol>
  <p id="empty" class="message" hidden></p>
 </main>
 <script>
  (function() {
   'use strict';
   let homey;
   let currentId = '';
   let loadingSequence = 0;
   let countPreferences = {};
   let cachedNotices = [];
   const DEFAULT_COUNT = 5;
   const MAX_COUNT = 50;
   const PREFERENCES_KEY = 'overview_visible_counts';
   const ui = Object.fromEntries(['heading','subtitle','address-label','monitor','count-label','count','save-count','count-hint','meta','refresh','status','notices','empty']
     .map(id => [id,document.getElementById(id)]));
   function t(nl,en){return (navigator.language||'nl').toLowerCase().startsWith('nl')?nl:en}
   function node(tag, cls, text) {
     const el=document.createElement(tag);
     if (cls) el.className=cls;
     if (text!=null) el.textContent=String(text);
     return el;
   }
   function api(method,path) {
     return new Promise((resolve,reject)=>{
       homey.api(method,path,null,(err,result)=>err?reject(err):resolve(result));
     });
   }
   function fmtDate(value) {
     if (!value) return '';
     const parsed=new Date(value);
     if (Number.isNaN(parsed.getTime())) return String(value);
     return new Intl.DateTimeFormat(t('nl-NL','en-GB'),{day:'2-digit',month:'2-digit',year:'numeric'}).format(parsed);
   }
   function category(id) {
     const names={permit:t('Vergunning','Permit'),traffic:t('Verkeer','Traffic'),tree:t('Bomen / kap','Trees'),event:t('Evenement','Event'),plan:t('Ruimtelijk plan','Planning'),regulation:t('Regelgeving','Regulation'),other:t('Overig','Other')};
     return names[id]||names.other;
   }
   function safeLink(value) {
     try {const url=new URL(value); if(url.protocol!=='https:'||url.username||url.password) return ''; return url.href}
     catch(_e){return ''}
   }
   function showMessage(message) {ui.notices.replaceChildren();ui.empty.hidden=false;ui.empty.textContent=message}
   function countFor(id) {
     const candidate = Object.prototype.hasOwnProperty.call(countPreferences,id) ? Number(countPreferences[id]) : NaN;
     return Number.isInteger(candidate) && candidate>=1 && candidate<=MAX_COUNT ? candidate : DEFAULT_COUNT;
   }
   function syncCount() {ui.count.value=String(countFor(currentId))}
   function settingsGet(name) {
     return new Promise((resolve,reject)=>homey.get(name,(error,value)=>error?reject(error):resolve(value)));
   }
   function settingsSet(name,value) {
     return new Promise((resolve,reject)=>homey.set(name,value,(error)=>error?reject(error):resolve()));
   }
   function renderNotices() {
     const count=countFor(currentId);
     const items=cachedNotices.slice(0,count);
     ui.notices.replaceChildren(...items.map(renderNotice));
     ui.empty.hidden=items.length>0;
     if(!items.length) ui.empty.textContent=t('Nog geen bekendmakingen opgeslagen. De lijst verschijnt na de eerstvolgende geslaagde controle (normaal binnen 15 minuten).','No notices saved yet. Results appear after the next successful check (normally within 15 minutes).');
     ui.status.textContent=t(items.length+' van maximaal '+count+' bekendmakingen zichtbaar',items.length+' of up to '+count+' notices shown');
   }
   async function saveCount() {
     if(!currentId)return;
     const raw=ui.count.value.trim();
     const value=Number(raw);
     if(!/^\d+$/.test(raw)||!Number.isInteger(value)||value<1||value>MAX_COUNT) {
       ui.status.textContent=t('Vul een heel getal tussen 1 en 50 in.','Enter a whole number from 1 to 50.');
       return;
     }
     const id=currentId;
     ui['save-count'].disabled=true;
     try {
       const updated={...countPreferences,[id]:value};
       await settingsSet(PREFERENCES_KEY,updated);
       countPreferences=updated;
       if(id===currentId) {
         renderNotices();
         ui.status.textContent=t('Opgeslagen: toon maximaal '+value+' bekendmakingen','Saved: show up to '+value+' notices');
       }
     }catch(error){
       if(id===currentId)syncCount();
       ui.status.textContent=t('Opslaan mislukt: ','Could not save: ')+String(error.message||error);
     }finally {ui['save-count'].disabled=false}
   }
   function renderNotice(notice) {
     const li=node('li','notice');
     const top=node('div','top');
     top.append(node('span','category',category(notice.category)));
     if (notice.publication_date) top.append(node('span','date',fmtDate(notice.publication_date)));
     const quality=notice.match_quality||'';
     if(quality==='possible')top.append(node('span','quality',t('Mogelijke gebiedstreffer','Possible area match')));
     if(quality==='municipality')top.append(node('span','quality',t('Gemeentebreed','Municipality-wide')));
     if(quality==='text')top.append(node('span','quality',t('Plaatsnaam in titel','Place name in title')));
     li.append(top);
     li.append(node('div','title',notice.title||t('Onbekende publicatie','Unknown publication')));
     if (notice.location) li.append(node('div','detail',t('Locatie: ','Location: ')+notice.location));
     if (notice.authority) li.append(node('div','detail',t('Instantie: ','Authority: ')+notice.authority));
     const url=safeLink(notice.url);
     if(url) {
       const a=node('a','link',t('Bekijk originele bekendmaking ↗','Open official notice ↗'));
       a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
       a.addEventListener('click',function(event) {
         if(typeof homey.openURL==='function') {event.preventDefault();homey.openURL(url)}
       });
       li.append(a);
     }
     return li;
   }
   async function loadNotices() {
     if(!currentId) return;
     const sequence=++loadingSequence;
     ui.status.textContent=t('Laden…','Loading…');
     try {
       const data=await api('GET','/monitors/'+encodeURIComponent(currentId)+'/notices');
       if(sequence!==loadingSequence) return;
       ui.meta.textContent=[data.address,data.search_mode&&data.search_mode!=='address'?t('Gebied: ','Area: ')+data.search_mode:(Number(data.radius_m)/1000).toLocaleString(t('nl-NL','en-GB'))+' km',data.checked_at?t('Laatste controle: ','Last check: ')+fmtDate(data.checked_at):'',data.limited?t('Resultaatlimiet bereikt: lijst mogelijk onvolledig','Result limit reached: list may be incomplete'):''].filter(Boolean).join(' · ');
       cachedNotices=Array.isArray(data.notices)?data.notices:[];
       renderNotices();
     }catch(error){
       if(sequence!==loadingSequence)return;
       showMessage(t('Het overzicht kon niet worden geladen.','Could not load the overview.'));
       ui.status.textContent=String(error.message||error);
     }
   }
   async function loadMonitors() {
     ui.status.textContent=t('Adressen ophalen…','Loading addresses…');
     try {
       const monitors=await api('GET','/monitors');
       ui.monitor.replaceChildren();
       for(const item of monitors) {
         const option=node('option','',item.name||item.address||item.id);
         option.value=item.id;
         ui.monitor.append(option);
       }
       if (!monitors.length) {
         ui.monitor.disabled=true;currentId='';
         showMessage(t('Voeg eerst een adres toe als Homey-apparaat.','First add a monitored address as a Homey device.'));
         ui.status.textContent='';return;
       }
       ui.monitor.disabled=false;
       // Homey settings run in a sandboxed iframe: browser storage is not accessible.
       // Keep the selected monitor in memory for this view, without sessionStorage.
       currentId=monitors.some(m=>m.id===currentId)?currentId:monitors[0].id;
       ui.monitor.value=currentId;
       syncCount();
       await loadNotices();
     }catch(error){showMessage(t('Kan de bewaakte adressen niet laden.','Could not load monitored addresses.'));ui.status.textContent=String(error.message||error)}
   }
   window.onHomeyReady=function(Homey) {
     homey=Homey;
     Homey.ready();
     ui['count-label'].textContent=t('Aantal zichtbare bekendmakingen','Number of notices to display');
     ui['save-count'].textContent=t('Opslaan','Save');
     ui['count-hint'].textContent=t('Kies 1 tot 50 per bewaakt adres. Standaard 5. Meer oudere berichten worden beschikbaar na de eerstvolgende geslaagde controle.','Choose 1 to 50 per monitored address. Default 5. More older notices become available after the next successful check.');
     ui.monitor.addEventListener('change',function(){currentId=ui.monitor.value;cachedNotices=[];syncCount();loadNotices()});
     ui.refresh.addEventListener('click',loadNotices);
     ui['save-count'].addEventListener('click',saveCount);
     (async()=>{
       try {
         const saved=await settingsGet(PREFERENCES_KEY);
         if(saved && typeof saved==='object' && !Array.isArray(saved)) countPreferences=saved;
       }catch(error){ui.status.textContent=t('Instellingen laden mislukt.','Could not load settings.');}
       await loadMonitors();
     })();
   };
  })();
 </script>
</body>
</html>
