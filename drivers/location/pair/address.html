<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;padding:18px 15px;font-family:inherit}
  .group{margin:0 0 18px}.group label{display:block;font-weight:650;margin:0 0 7px}
  select,input{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;font:inherit}
  .hint{opacity:.73;font-size:12px;margin:6px 0;line-height:1.5}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .actions button{padding:10px 13px;border-radius:8px;cursor:pointer}
  [hidden]{display:none!important}
  #result{min-height:18px;margin-top:12px;line-height:1.45}
</style>
</head>
<body>
  <form id="form" class="homey-form">
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend" id="legend">Monitor a location or address</legend>
      <div class="group">
        <label id="mode-label" for="mode">Search method</label>
        <select id="mode" class="homey-form-select">
          <option id="option-address" value="address">Address + custom radius</option>
          <option id="option-woonplaats" value="woonplaats">Town or city</option>
          <option id="option-wijk" value="wijk">District</option>
          <option id="option-buurt" value="buurt">Neighbourhood</option>
          <option id="option-gemeente" value="gemeente">Municipality</option>
        </select>
      </div>
      <section id="address-fields">
        <div class="group">
          <label id="address-label" for="address">Full address</label>
          <input id="address" class="homey-form-input" type="text" placeholder="Dorpsweg 1, Rotterdam" autocomplete="street-address">
        </div>
        <div class="group">
          <label id="radius-label" for="radius">Radius in metres</label>
          <input id="radius" class="homey-form-input" type="number" inputmode="numeric" min="50" max="50000" step="50" value="1000">
          <p id="radius-details" class="hint">From 50 metres to 50 km around the selected address.</p>
        </div>
      </section>
      <section id="area-fields" hidden>
        <div class="group">
          <label id="area-search-label" for="area-query">Search for a place or area</label>
          <input id="area-query" class="homey-form-input" type="text" placeholder="Rozenburg" autocomplete="off">
          <p id="area-help" class="hint">Select the correct PDOK result after searching.</p>
        </div>
        <div class="actions"><button type="button" id="find">Find area</button></div>
        <div class="group" id="results-group" hidden>
          <label id="choose-area-label" for="area-results">Choose the correct area</label>
          <select id="area-results" class="homey-form-select"></select>
        </div>
        <p id="area-warning" class="hint">Notices without sufficient location information may be missing.</p>
      </section>
    </fieldset>
    <button id="add" class="homey-button-primary-full" type="submit">Add to Homey</button>
    <p class="hint" id="result" aria-live="polite"></p>
  </form>
  <script>
    const el=id=>document.getElementById(id);
    function tr(key,fallback,vars){
      let value=fallback;
      if (typeof Homey.__==='function') {
        try {const translated=Homey.__('pair.'+key,vars);if(translated&&translated!=='pair.'+key)value=translated}
        catch(_error){}
      }
      if(vars)for(const [name,replacement] of Object.entries(vars))value=value.replace(new RegExp('\\{'+name+'\\}','g'),String(replacement));
      return value;
    }
    function translateView(){
      const entries={
        'legend':['legend','Monitor a location or address'],
        'mode-label':['mode_title','Search method'],
        'option-address':['mode_address','Address + custom radius'],
        'option-woonplaats':['mode_woonplaats','Town or city'],
        'option-wijk':['mode_wijk','District'],
        'option-buurt':['mode_buurt','Neighbourhood'],
        'option-gemeente':['mode_gemeente','Municipality'],
        'address-label':['full_address','Full address'],
        'radius-label':['radius_label','Radius in metres'],
        'radius-details':['radius_details','From 50 metres to 50 km around the selected address.'],
        'area-search-label':['area_search_label','Search for a place or area'],
        'area-help':['area_help','Select the correct PDOK result after searching.'],
        'find':['search_button','Find area'],
        'choose-area-label':['choose_area_label','Choose the correct area'],
        'area-warning':['area_warning','Notices without sufficient location information may be missing.'],
        'add':['add_button','Add to Homey']
      };
      for(const [id,[key,fallback]]of Object.entries(entries))el(id).textContent=tr(key,fallback);
      el('address').placeholder=tr('address_placeholder','Dorpsweg 1, Rotterdam');
      el('area-query').placeholder=tr('area_placeholder','Rozenburg');
    }
    let candidates=[];
    function displayMode(){
      const isAddress=el('mode').value==='address';
      el('address-fields').hidden=!isAddress;el('area-fields').hidden=isAddress;
      candidates=[];el('results-group').hidden=true;el('result').textContent='';
    }
    async function search(){
      const type=el('mode').value,query=el('area-query').value.trim();
      if(query.length<2){el('result').textContent=tr('type_two','Enter at least 2 characters.');return}
      const btn=el('find');btn.disabled=true;el('result').textContent=tr('searching','Searching areas…');
      try{
        const areas=await Homey.emit('search_areas',{type,query});
        candidates=Array.isArray(areas)?areas:[];
        const select=el('area-results');select.replaceChildren();
        for(const a of candidates){const option=document.createElement('option');option.value=a.id;option.textContent=a.label;select.append(option)}
        el('results-group').hidden=!candidates.length;
        el('result').textContent=candidates.length?tr('areas_found','{count} possible areas found. Select the correct one.',{count:candidates.length}):tr('areas_not_found','No area found. Try a more specific search.');
      }catch(err){candidates=[];el('results-group').hidden=true;el('result').textContent=err?.message||String(err)}
      finally{btn.disabled=false}
    }
    async function submit(ev){
      ev.preventDefault();const btn=el('add');btn.disabled=true;
      el('result').textContent=tr('checking','Checking…');
      try{
        let device;
        if(el('mode').value==='address'){
          const address=el('address').value.trim(),radiusM=Number(el('radius').value);
          if(!address)throw new Error(tr('missing_address','Enter an address first.'));
          device=await Homey.emit('validate_address',{address,radiusM});
        }else{
          const type=el('mode').value,id=el('area-results').value;
          if(!candidates.some(c=>c.id===id&&c.type===type))throw new Error(tr('missing_area','First search for and select the correct area.'));
          device=await Homey.emit('validate_area',{type,id});
        }
        await Homey.createDevice(device);
        Homey.done();
      }catch(err){el('result').textContent=err?.message||String(err);btn.disabled=false;await Homey.alert(err?.message||String(err),'error')}
    }
    el('mode').addEventListener('change',displayMode);
    el('area-query').addEventListener('input',()=>{candidates=[];el('results-group').hidden=true});
    el('find').addEventListener('click',search);
    el('form').addEventListener('submit',submit);
    Homey.setTitle(tr('window_title','Bekendmakingen NL'));translateView();displayMode();
  </script>
</body>
</html>
